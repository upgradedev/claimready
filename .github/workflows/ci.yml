name: CI

# ClaimReady has zero dependencies. No job installs anything, ever.
# If a step here ever needs a package manager, the change is wrong.
#
# THIS WORKFLOW IS ABOUT THE ENGINEERING AND NOTHING ELSE.
# The readiness gate used to be a fourth job here, which meant the public CI badge went red on
# every branch for a missing video while secret scan, style and tests were all green. Submission
# readiness now has its own workflow and its own badge, .github/workflows/readiness.yml, and it is
# not weaker for having moved: same script, same arguments, same triggers, and a missing mandatory
# deliverable still fails it in every mode. Do not fold it back in here.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required only for repositories owned by an organisation.
          # A personal public repository needs nothing here.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  style:
    name: Style gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: No em dash, no annotation that does not exist, no foreign project name, tool budgets
        run: node scripts/check_style.mjs

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: The domain must be testable without a browser
        run: |
          if [ ! -d tests/unit ]; then
            echo "tests/unit does not exist. The domain is untested, and that is a real failure, not a missing directory."
            exit 1
          fi
          node --test tests/unit

      # THE PUBLISHED COVERAGE NUMBER MUST BE ABOUT THE PRODUCT.
      #
      # Node's own "all files" line is not. Its denominator is only what the run loaded, so a source
      # file no test imports is absent from the table rather than counted as zero: src/ui/render.js
      # and src/ui/app.js, 1,929 lines between them and the two largest files here, were absent
      # while the total read 94.84%. Its numerator also includes the test files, which are near 100%
      # because a test file runs by definition, and scripts/, which is near 40% because most of it
      # is a command line path no test takes.
      #
      # So this step prints BOTH: the built in table, unchanged, and a second table restricted to
      # src and computed from the exact line, branch and function counts rather than by averaging
      # percentages. Node accepts more than one --test-reporter, which is how both appear.
      #
      # The reporter also fails the build, and it has two ways to do it. It has floors, set at or
      # just under what the suite measures today so they are honest and can only be raised. And it
      # lists every .js file under src off the filesystem and fails when one of them never appeared
      # in the run at all, which is the check that would have caught the original defect and the one
      # a percentage cannot make. Both were demonstrated failing before this step was added.
      - name: Coverage of src, printed and gated
        run: |
          node --test \
            --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./tests/support/coverage_report.mjs --test-reporter-destination=stdout \
            tests/unit
