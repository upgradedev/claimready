name: WebMCP evals

# Deterministic smoke evals against the deployed judge URL.
#
# WHY THIS IS A SEPARATE WORKFLOW FROM ci.yml.
# ci.yml says, correctly, that no job in it installs anything, ever. That claim is about ci.yml
# and it stays true. This workflow is the deliberate exception: the eval harness is a third party
# CLI and a browser, neither of which can be vendored into a zero dependency page. Nothing this
# workflow installs is a dependency of the product. The page still ships with none.
#
# HONESTY RULE FOR THIS FILE.
# No step here is allowed to swallow a failure to make the run look green. There is no
# continue-on-error on the eval step, no `|| true` on anything that is a check, and no fallback
# that turns "the harness could not run" into a pass. If the harness cannot run on a runner, this
# workflow fails and says why. See evals/README.md for what has actually been observed to work.
#
# THERE ARE TWO JOBS. `smoke` drives the third party eval harness. `probe` drives our own
# dependency free probe, evals/browser_probe.mjs, against a Chrome carrying the WebMCP flag, and it
# judges the run with evals/probe_assertions.mjs rather than printing what it saw. They do not
# depend on each other on purpose: a failure to BUILD somebody else's harness must not be able to
# hide whether our own page still behaves.
#
# ONE STEP DELIBERATELY EXPECTS THE HARNESS TO FAIL, and it is not an exception to the rule above.
# The negative control step runs the harness with `set +e` so it can read the exit CODE rather than
# be killed by it, and it then requires that code to be non zero and requires two exact strings in
# the log. A green harness there turns that step red. It is the opposite of laundering: it is the
# only way to assert that something the page must refuse was in fact refused.

on:
  workflow_dispatch:
    inputs:
      chrome_channel:
        description: "Puppeteer channel the harness should drive. The harness default is chrome-canary, which has no Linux build."
        type: string
        default: "chrome-dev"
      timeout_ms:
        description: "Per step timeout in milliseconds passed to the harness."
        type: string
        default: "30000"
  schedule:
    # Once a day while the entry is being judged, so a live surface that quietly stops serving
    # the tools is found by a failing run rather than by a judge.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # WHY THIS IS BUILT FROM SOURCE RATHER THAN INSTALLED FROM npm.
  # The first real run of this workflow, 33069947791, failed with `error: unknown command 'smoke'`.
  # Measured afterwards: npm has published exactly 0.0.1, 0.0.2 and 0.0.3 of webmcp-evals, latest
  # 0.0.3 from 2026-07-17, and its CLI offers only `local` and `browser`. The deterministic `smoke`
  # command, the one that needs no model and no API key, exists only on the project's main branch
  # and has never been released. So the published package cannot run the mode this entry wants, and
  # pretending otherwise is how a workflow that has never executed comes to describe a capability
  # nobody has. The harness is therefore cloned at a pinned commit and built here.
  EVALS_REPO: "https://github.com/GoogleChromeLabs/webmcp-tools.git"
  # Pinned to a commit, not a branch. A branch makes a run irreproducible and lets an upstream push
  # change the verdict silently.
  EVALS_COMMIT: "d39eae4bd51e8c12736b8cae840bd98f190f3179"

jobs:
  smoke:
    name: Smoke evals against the live page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # PRE FLIGHT, AND IT IS A GATE. Dependency free, no browser, no install. It replays the
      # journeys and the negative control against the real registration path with a fake host, and
      # it runs the three mutations that must each make the control report NOT PROVEN. If the
      # control's expectation has stopped matching the code at this commit, this fails here rather
      # than being read as a browser problem forty seconds later.
      #
      # THE MUTATION LIST IS NOT REPEATED HERE ANY MORE. This step used to loop three mutation
      # names typed out in the shell, so the registry in evals/replay.mjs and the list CI actually
      # ran were two copies of one thing. A fourth mutation was added to the registry and would
      # have been executed by nothing, which is the dead configuration this repository fails other
      # people's work for. `--selftest` iterates the registry, picks each mutation's declared suite
      # and requires every one of them to exit non zero, so adding a mutation is adding a CI case.
      # tests/unit/replay_oracle.test.js asserts this line still says --selftest.
      - name: Replay the journeys and the negative control offline
        shell: bash
        run: |
          set -euo pipefail
          node evals/replay.mjs --quiet
          node evals/replay.mjs --negative-control --quiet
          node evals/replay.mjs --selftest

      # The URL is the whole point. An empty variable is a failure, never a skip.
      - name: The judge URL must be configured
        shell: bash
        env:
          CLAIMREADY_URL: ${{ vars.CLAIMREADY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CLAIMREADY_URL:-}" ]; then
            echo "CLAIMREADY_URL is not set as a repository variable."
            echo "There is nothing to evaluate. This is a failure, not a skip: a green run here"
            echo "would claim the live tool surface was exercised when no page was fetched."
            exit 1
          fi
          echo "Target: ${CLAIMREADY_URL}"

      # Fetch the page before trusting any harness verdict. A readiness gate that never touches
      # the live URL can stay green through a total outage.
      - name: The live page must answer 200
        shell: bash
        env:
          CLAIMREADY_URL: ${{ vars.CLAIMREADY_URL }}
        run: |
          set -euo pipefail
          code="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' "${CLAIMREADY_URL}")"
          echo "HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "The live judge URL did not answer 200. Fixing that is the whole task."
            exit 1
          fi
          # Cheap shape check on the bytes actually served, not on the repository source.
          if ! grep -q 'src/ui/app.js' /tmp/page.html; then
            echo "The served page does not reference the module that registers the tools."
            echo "Something is deployed, but it is not this product."
            exit 1
          fi

      # Build the harness from the pinned commit. This is the step that has to work before any
      # verdict from it means anything.
      - name: Build the eval harness from source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "${EVALS_REPO}" /tmp/webmcp-tools
          git -C /tmp/webmcp-tools checkout "${EVALS_COMMIT}"
          cd /tmp/webmcp-tools/webmcp-evals
          npm install --no-audit --no-fund
          npm run build
          node dist/bin/webmcp-evals.js --version
          echo "EVALS_BIN=/tmp/webmcp-tools/webmcp-evals/dist/bin/webmcp-evals.js" >> "$GITHUB_ENV"

      # DIAGNOSTIC, NOT A GATE. Record what the built CLI actually offers, so a future reader can
      # see the command surface this run was judged against rather than trusting this comment.
      # `|| true` is deliberate and confined to this step, which asserts nothing.
      - name: Record the harness command surface
        shell: bash
        run: |
          node "${EVALS_BIN}" --help 2>&1 | tee -a harness-help.log || true
          node "${EVALS_BIN}" smoke --help 2>&1 | tee -a harness-help.log || true

      # The harness drives Chrome through Puppeteer and its default channel is chrome-canary,
      # which Google does not build for Linux. The Dev channel is the closest Linux equivalent.
      # Whether this build exposes the tool surface the harness expects is UNVERIFIED, and a
      # failure here is reported as a failure rather than worked around.
      - name: Install the Chrome Dev channel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/chrome-dev.deb \
            https://dl.google.com/linux/direct/google-chrome-unstable_current_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/chrome-dev.deb
          google-chrome-unstable --version

      - name: Smoke evals
        shell: bash
        env:
          CLAIMREADY_URL: ${{ vars.CLAIMREADY_URL }}
          CHROME_CHANNEL: ${{ inputs.chrome_channel || 'chrome-dev' }}
          TIMEOUT_MS: ${{ inputs.timeout_ms || '30000' }}
        run: |
          set -euo pipefail
          # pipefail matters: without it, tee would hand back its own exit code and every
          # failing eval run would report success.
          #
          # The harness launches Chrome itself with --enable-features=WebMCP, so the tools are
          # registered against the browser's OWN implementation. That is the whole reason this
          # workflow is worth running: nothing else in this repository has ever exercised a native
          # WebMCP host, and a shim written by the same project that it verifies proves very little.
          node "${EVALS_BIN}" smoke \
            -u "${CLAIMREADY_URL}" \
            -e evals/evals.json \
            --chrome-channel "${CHROME_CHANNEL}" \
            --timeout "${TIMEOUT_MS}" \
            -v 2>&1 | tee evals-smoke.log

      # THE NEGATIVE CONTROL, IN THE BROWSER. This run is EXPECTED TO FAIL, and a green harness
      # here is what turns this step red.
      #
      # WHY IT EXISTS. Every answer this page gives comes back through toResult, so a refusal
      # travels inside an ordinary result envelope and the harness's explicitToolFailure can never
      # see it. The step above therefore cannot tell a refusal from a success. Tool AVAILABILITY is
      # the one channel with teeth: the harness re reads the tool list before every step and stops
      # the case when a tool is missing.
      #
      # Journey 2 uses that channel one way round: after a STALE patch is refused,
      # get_assistance_options must still be there. That direction alone is satisfiable by a page
      # that simply never changes its tool set, so on its own it does not prove the refusal
      # refused. This file closes the loop the other way. The patch at step 5 is legal, it must
      # land, vehicle_drivable goes back to true and the ninth tool must be WITHDRAWN, so step 8
      # must fail with `tool "get_assistance_options" is not available.`
      #
      # Read as a pair: journey 2 shows the surface does not move when a patch is refused, and this
      # shows the surface DOES move when a patch is applied. Neither is a no op, because the same
      # page produced both.
      #
      # Three assertions, and all three have to hold, so this cannot pass for the wrong reason:
      #   the harness must exit non zero;
      #   exactly seven of eight steps must have passed, which pins the failure to the last step and
      #     proves the legal patch at step 5 was not refused;
      #   the failure must name step 8 and the missing tool.
      # If the ninth tool were never registered at all, the case would die at step 4 with the same
      # sentence and a 3/8 summary, and the second assertion refuses that.
      #
      # WHY THE CASE SETTLES TWICE BEFORE THE LAST STEP. The harness polls for up to five seconds
      # for a tool to APPEAR and does not poll at all for one to DISAPPEAR, so absence is read once,
      # immediately. Steps 6 and 7 are both no op reads that give the page's un awaited reconcile,
      # and the browser's own tool list, room to settle before that single read.
      - name: Negative control, a patch that lands must withdraw the ninth tool
        shell: bash
        env:
          CLAIMREADY_URL: ${{ vars.CLAIMREADY_URL }}
          CHROME_CHANNEL: ${{ inputs.chrome_channel || 'chrome-dev' }}
          TIMEOUT_MS: ${{ inputs.timeout_ms || '30000' }}
          # The assertions below are exact string matches. chalk colours its output on a GitHub
          # runner because CI and GITHUB_ACTIONS are both set, so colour is turned off here and the
          # log is stripped again afterwards. A gate that silently stopped matching because of an
          # escape sequence would be a gate that had stopped gating.
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          set -uo pipefail
          set +e
          node "${EVALS_BIN}" smoke \
            -u "${CLAIMREADY_URL}" \
            -e evals/negative-control.json \
            --chrome-channel "${CHROME_CHANNEL}" \
            --timeout "${TIMEOUT_MS}" \
            -v > evals-negative-control.raw.log 2>&1
          harness_exit=$?
          set -e

          sed -r 's/\x1b\[[0-9;]*m//g' evals-negative-control.raw.log > evals-negative-control.log
          cat evals-negative-control.log

          failures=0

          if [ "${harness_exit}" -eq 0 ]; then
            echo "ASSERTION 1 FAILED: the harness exited 0. The negative control is supposed to fail."
            echo "Either the legal patch was refused, or the ninth tool was not withdrawn."
            failures=1
          else
            echo "ASSERTION 1 passed: the harness exited ${harness_exit}."
          fi

          if ! grep -qF 'Passed steps: 7/8 across 1 case(s).' evals-negative-control.log; then
            echo "ASSERTION 2 FAILED: the summary is not 'Passed steps: 7/8 across 1 case(s).'"
            echo "Seven of eight is the only shape that means the run reached the last step with"
            echo "everything before it green. Anything else failed somewhere it was not supposed to."
            echo "A summary of 8/8 means the ninth tool was still there. Read the note in"
            echo "evals/README.md under 'Still owed' before touching anything: the likeliest cause"
            echo "is the browser's withdrawal, not this assertion, and the assertion is never the fix."
            failures=1
          else
            echo "ASSERTION 2 passed: seven of eight steps passed, so the patch at step 5 landed."
          fi

          if ! grep -qF 'step 8 (get_assistance_options): tool "get_assistance_options" is not available.' evals-negative-control.log; then
            echo "ASSERTION 3 FAILED: step 8 did not report the ninth tool missing."
            failures=1
          else
            echo "ASSERTION 3 passed: step 8 found the ninth tool withdrawn."
          fi

          if [ "${failures}" -ne 0 ]; then
            echo "The negative control did not hold. Fix the page, never this check."
            exit 1
          fi
          echo "Negative control held. The tool surface moved because a patch was applied."

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webmcp-evals-report
          # .evals is where the harness writes JSON and HTML reports when it writes any. Whether
          # the smoke command produces one is unverified, so the tee'd log is the artifact that is
          # always present and the report directory is uploaded only if it appeared.
          path: |
            evals-smoke.log
            evals-negative-control.log
            evals-negative-control.raw.log
            harness-help.log
            .evals/
          if-no-files-found: warn
          retention-days: 30

  probe:
    # MANUAL DISPATCH ONLY, AND THE REASON IS NOT THAT A RUNNER CANNOT DO THIS.
    #
    # A runner can. The Chrome Dev channel installs the same way it does for the job above and for
    # the video capture in .github/workflows/video.yml, and the probe is dependency free Node
    # talking to that Chrome over the DevTools protocol.
    #
    # The reason is this. evals/browser_probe.mjs gained a phase that reads the planted evidence
    # note and then presses the page's own pin control twice, and those two clicks have never been
    # watched against a live browser by anyone. tests/unit/probe_note_phase.test.js executes that
    # phase against the real page with a fake host, so the page's half is proven, and the selector's
    # half is not. Putting an unwatched step on a daily cron during a judging window means the first
    # red badge on this repository could be reporting our own collection step rather than a defect
    # in the page, which is the sort of noise that gets a real failure ignored.
    #
    # TO PUT IT ON THE SCHEDULE, once somebody has dispatched this job and watched it pass: delete
    # the `if:` line directly below. Nothing else changes. Record the run id in evals/README.md
    # under "Still owed on the probe" and delete that paragraph.
    #
    # It is NOT allowed to become a job that passes without doing anything. There is no
    # continue-on-error here and no `|| true` on anything that is a check. If Chrome will not start,
    # if the page does not answer 200, or if the judgement refuses the transcript, this job is red.
    if: github.event_name == 'workflow_dispatch'
    name: Browser probe against the live page (manual dispatch only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The judgement is a pure module and the mutations that prove it fails cost nothing, so they
      # run before a browser is opened. A judgement that has stopped refusing what it should refuse
      # is found here rather than being read as a green browser run a minute later.
      - name: The judgement must still refuse what it is supposed to refuse
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/unit/probe_assertions.test.js
          node --test tests/unit/probe_note_phase.test.js

      # The URL is the whole point. An empty variable is a failure, never a skip.
      - name: The judge URL must be configured
        shell: bash
        env:
          CLAIMREADY_URL: ${{ vars.CLAIMREADY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CLAIMREADY_URL:-}" ]; then
            echo "CLAIMREADY_URL is not set as a repository variable."
            echo "There is nothing to probe. This is a failure, not a skip."
            exit 1
          fi
          echo "Target: ${CLAIMREADY_URL}"

      - name: The live page must answer 200
        shell: bash
        env:
          CLAIMREADY_URL: ${{ vars.CLAIMREADY_URL }}
        run: |
          set -euo pipefail
          code="$(curl -sS -L -o /tmp/probe-page.html -w '%{http_code}' "${CLAIMREADY_URL}")"
          echo "HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "The live judge URL did not answer 200. Fixing that is the whole task."
            exit 1
          fi

      # The same build the eval harness drives and the same one the video capture films against.
      # Chrome stable carries WebMCP too, and the Dev channel is what CI has always installed here,
      # so this stays the same fact in one more place rather than a second thing to keep right.
      - name: Install the Chrome Dev channel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/chrome-dev.deb \
            https://dl.google.com/linux/direct/google-chrome-unstable_current_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/chrome-dev.deb
          google-chrome-unstable --version

      # The probe attaches to a browser somebody else started, which is how it is documented and how
      # it is run on a desktop. So the browser is started here with the same command line the header
      # of evals/browser_probe.mjs gives, and this step waits for the DevTools endpoint to answer
      # rather than sleeping and hoping.
      # --no-sandbox is here and NOT in the command line at the top of evals/browser_probe.mjs,
      # and the difference is deliberate. A runner runs this as root, where Chrome's sandbox
      # refuses to start. A desktop does not, so the documented desktop command line keeps the
      # sandbox on. Two command lines that disagree are worth one sentence rather than an hour.
      - name: Start Chrome with WebMCP on, pointed at the live page
        shell: bash
        env:
          CLAIMREADY_URL: ${{ vars.CLAIMREADY_URL }}
        run: |
          set -euo pipefail
          profile="$(mktemp -d)"
          google-chrome-unstable \
            --headless=new \
            --disable-gpu \
            --no-sandbox \
            --enable-features=WebMCP \
            --remote-debugging-port=9222 \
            --user-data-dir="${profile}" \
            "${CLAIMREADY_URL}" > /tmp/chrome.log 2>&1 &
          echo "CHROME_PID=$!" >> "$GITHUB_ENV"

          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9222/json/version > /tmp/cdp-version.json; then
              cat /tmp/cdp-version.json
              exit 0
            fi
            sleep 1
          done
          echo "Chrome never opened a DevTools endpoint on 9222 in 30 seconds."
          echo "This is a failure. A probe with nothing to attach to proves nothing."
          cat /tmp/chrome.log || true
          exit 1

      # THE GATE. It exits non zero when the judgement says the page did not do what it promises,
      # and the transcript it printed is uploaded either way so a reader can see what was judged.
      - name: Probe the live page and judge what it did
        shell: bash
        env:
          CLAIMREADY_URL: ${{ vars.CLAIMREADY_URL }}
        run: |
          set -euo pipefail
          # pipefail matters: without it tee hands back its own exit code and a failing probe
          # reports success.
          node evals/browser_probe.mjs 2>&1 | tee probe.log

      # Housekeeping, and it asserts nothing, which is why `|| true` is allowed here and nowhere
      # else in this job. The browser's own log is copied into the workspace because
      # upload-artifact wants paths under it.
      - name: Stop Chrome and keep its log
        if: always()
        shell: bash
        run: |
          if [ -n "${CHROME_PID:-}" ]; then kill "${CHROME_PID}" || true; fi
          cp /tmp/chrome.log chrome.log || true
          cp /tmp/cdp-version.json cdp-version.json || true

      - name: Upload the transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webmcp-browser-probe
          path: |
            probe.log
            chrome.log
            cdp-version.json
          if-no-files-found: warn
          retention-days: 30
