name: WebMCP evals

# Deterministic smoke evals against the deployed judge URL.
#
# WHY THIS IS A SEPARATE WORKFLOW FROM ci.yml.
# ci.yml says, correctly, that no job in it installs anything, ever. That claim is about ci.yml
# and it stays true. This workflow is the deliberate exception: the eval harness is a third party
# CLI and a browser, neither of which can be vendored into a zero dependency page. Nothing this
# workflow installs is a dependency of the product. The page still ships with none.
#
# HONESTY RULE FOR THIS FILE.
# No step here is allowed to swallow a failure to make the run look green. There is no
# continue-on-error on the eval step, no `|| true` on anything that is a check, and no fallback
# that turns "the harness could not run" into a pass. If the harness cannot run on a runner, this
# workflow fails and says why. See evals/README.md for what has actually been observed to work.

on:
  workflow_dispatch:
    inputs:
      chrome_channel:
        description: "Puppeteer channel the harness should drive. The harness default is chrome-canary, which has no Linux build."
        type: string
        default: "chrome-dev"
      timeout_ms:
        description: "Per step timeout in milliseconds passed to the harness."
        type: string
        default: "30000"
  schedule:
    # Once a day while the entry is being judged, so a live surface that quietly stops serving
    # the tools is found by a failing run rather than by a judge.
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # WHY THIS IS BUILT FROM SOURCE RATHER THAN INSTALLED FROM npm.
  # The first real run of this workflow, 33069947791, failed with `error: unknown command 'smoke'`.
  # Measured afterwards: npm has published exactly 0.0.1, 0.0.2 and 0.0.3 of webmcp-evals, latest
  # 0.0.3 from 2026-07-17, and its CLI offers only `local` and `browser`. The deterministic `smoke`
  # command, the one that needs no model and no API key, exists only on the project's main branch
  # and has never been released. So the published package cannot run the mode this entry wants, and
  # pretending otherwise is how a workflow that has never executed comes to describe a capability
  # nobody has. The harness is therefore cloned at a pinned commit and built here.
  EVALS_REPO: "https://github.com/GoogleChromeLabs/webmcp-tools.git"
  # Pinned to a commit, not a branch. A branch makes a run irreproducible and lets an upstream push
  # change the verdict silently.
  EVALS_COMMIT: "d39eae4bd51e8c12736b8cae840bd98f190f3179"

jobs:
  smoke:
    name: Smoke evals against the live page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The URL is the whole point. An empty variable is a failure, never a skip.
      - name: The judge URL must be configured
        shell: bash
        env:
          CLAIMREADY_URL: ${{ vars.CLAIMREADY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CLAIMREADY_URL:-}" ]; then
            echo "CLAIMREADY_URL is not set as a repository variable."
            echo "There is nothing to evaluate. This is a failure, not a skip: a green run here"
            echo "would claim the live tool surface was exercised when no page was fetched."
            exit 1
          fi
          echo "Target: ${CLAIMREADY_URL}"

      # Fetch the page before trusting any harness verdict. A readiness gate that never touches
      # the live URL can stay green through a total outage.
      - name: The live page must answer 200
        shell: bash
        env:
          CLAIMREADY_URL: ${{ vars.CLAIMREADY_URL }}
        run: |
          set -euo pipefail
          code="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' "${CLAIMREADY_URL}")"
          echo "HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "The live judge URL did not answer 200. Fixing that is the whole task."
            exit 1
          fi
          # Cheap shape check on the bytes actually served, not on the repository source.
          if ! grep -q 'src/ui/app.js' /tmp/page.html; then
            echo "The served page does not reference the module that registers the tools."
            echo "Something is deployed, but it is not this product."
            exit 1
          fi

      # Build the harness from the pinned commit. This is the step that has to work before any
      # verdict from it means anything.
      - name: Build the eval harness from source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "${EVALS_REPO}" /tmp/webmcp-tools
          git -C /tmp/webmcp-tools checkout "${EVALS_COMMIT}"
          cd /tmp/webmcp-tools/webmcp-evals
          npm install --no-audit --no-fund
          npm run build
          node dist/bin/webmcp-evals.js --version
          echo "EVALS_BIN=/tmp/webmcp-tools/webmcp-evals/dist/bin/webmcp-evals.js" >> "$GITHUB_ENV"

      # DIAGNOSTIC, NOT A GATE. Record what the built CLI actually offers, so a future reader can
      # see the command surface this run was judged against rather than trusting this comment.
      # `|| true` is deliberate and confined to this step, which asserts nothing.
      - name: Record the harness command surface
        shell: bash
        run: |
          node "${EVALS_BIN}" --help 2>&1 | tee -a harness-help.log || true
          node "${EVALS_BIN}" smoke --help 2>&1 | tee -a harness-help.log || true

      # The harness drives Chrome through Puppeteer and its default channel is chrome-canary,
      # which Google does not build for Linux. The Dev channel is the closest Linux equivalent.
      # Whether this build exposes the tool surface the harness expects is UNVERIFIED, and a
      # failure here is reported as a failure rather than worked around.
      - name: Install the Chrome Dev channel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/chrome-dev.deb \
            https://dl.google.com/linux/direct/google-chrome-unstable_current_amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/chrome-dev.deb
          google-chrome-unstable --version

      - name: Smoke evals
        shell: bash
        env:
          CLAIMREADY_URL: ${{ vars.CLAIMREADY_URL }}
          CHROME_CHANNEL: ${{ inputs.chrome_channel || 'chrome-dev' }}
          TIMEOUT_MS: ${{ inputs.timeout_ms || '30000' }}
        run: |
          set -euo pipefail
          # pipefail matters: without it, tee would hand back its own exit code and every
          # failing eval run would report success.
          #
          # The harness launches Chrome itself with --enable-features=WebMCP, so the tools are
          # registered against the browser's OWN implementation. That is the whole reason this
          # workflow is worth running: nothing else in this repository has ever exercised a native
          # WebMCP host, and a shim written by the same project that it verifies proves very little.
          node "${EVALS_BIN}" smoke \
            -u "${CLAIMREADY_URL}" \
            -e evals/evals.json \
            --chrome-channel "${CHROME_CHANNEL}" \
            --timeout "${TIMEOUT_MS}" \
            -v 2>&1 | tee evals-smoke.log

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webmcp-evals-report
          # .evals is where the harness writes JSON and HTML reports when it writes any. Whether
          # the smoke command produces one is unverified, so the tee'd log is the artifact that is
          # always present and the report directory is uploaded only if it appeared.
          path: |
            evals-smoke.log
            harness-help.log
            .evals/
          if-no-files-found: warn
          retention-days: 30
